
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Raízes Nordestinas</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/conta.css">
    <script src="JS/conta.js" defer></script>
</head>
<body>
    <main class="conta-container">
        <section class="conta-card">
            <a href="index.html">← Voltar ao início</a>

            <h1>Crie sua conta 🌵</h1>
            <p>Cadastre-se para aproveitar nossos sabores!</p>

            <form id="form-cadastro">
                <label for="nome">Nome completo</label>
                <input id="nome" type="text"
                       autocomplete="name" required>

                <label for="email">E-mail</label>
                <input id="email" type="email"
                       autocomplete="email" required>

                <label for="telefone">Telefone</label>
                <input id="telefone" type="tel"
                       autocomplete="tel" required>

                <button type="submit" class="button button-primary">
                    Criar cadastro demonstrativo
                </button>
            </form>

            <p id="mensagem-cadastro" role="status"></p>

            <p>Já possui cadastro?
                <a href="login.html">Entrar</a>
            </p>
        </section>
    </main>
</body>
</html>
