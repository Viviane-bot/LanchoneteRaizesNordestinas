
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Entrar | Raízes Nordestinas</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/conta.css">
    <script src="JS/conta.js" defer></script>
</head>
<body>
    <main class="conta-container">
        <section class="conta-card">
            <a href="index.html">← Voltar ao início</a>

            <h1>Bem-vindo de volta!</h1>
            <p>Acesse sua conta demonstrativa.</p>

            <form id="form-login">
                <label for="email-login">E-mail cadastrado</label>
                <input id="email-login" type="email"
                       autocomplete="email" required>

                <button class="button button-primary"
                        type="submit">
                    Entrar
                </button>
            </form>

            <p id="mensagem-login" role="status"></p>

            <p>Ainda não tem cadastro?
                <a href="cadastro.html">Cadastre-se</a>
            </p>
        </section>
    </main>
</body>
</html>
